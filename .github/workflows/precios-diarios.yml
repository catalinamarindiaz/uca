name: Actualizar precios diarios Fronx

on:
  # SIN cron automatico: Chileautos y Yapo bloquean las IPs de los
  # servidores de GitHub (Cloudflare anti-bot), confirmado el 2026-10-07.
  # La actualizacion diaria real corre desde el computador de Cata
  # (tarea programada de Windows). Este workflow queda solo como respaldo
  # manual por si se prueba desde otra red que si pueda acceder.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install playwright

      - name: Instalar navegador de Playwright
        run: playwright install chromium --with-deps

      - name: Extraer precios
        id: extraer
        # El script sale con codigo 1 si alguna categoria no tuvo avisos
        # suficientes (pero igual guarda las que si pudo actualizar).
        # continue-on-error para que el commit de abajo no se salte por eso.
        continue-on-error: true
        run: python precios/precios_diarios.py

      - name: Marcar el run como fallido si el script fallo de verdad
        if: steps.extraer.outcome == 'failure'
        run: echo "::warning::El script termino con avisos insuficientes para alguna categoria. Revisar logs arriba."

      - name: Guardar resultado (commit solo si hubo cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios/data/ultimo.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los precios."
          else
            git commit -m "chore: actualiza precios Fronx $(date -u +%Y-%m-%d)"
            git push
          fi
